<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grazie! | #Finsubito</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .thank-you-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            text-align: center;
            animation: fadeIn 1s ease-in;
        }

        .thank-you-card {
            background: rgba(30, 41, 59, 0.8);
            padding: 3rem;
            border-radius: 20px;
            border: 1px solid #38bdf8;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            max-width: 600px;
        }

        .thank-you-card h1 {
            color: #38bdf8;
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .thank-you-card p {
            font-size: 1.2rem;
            color: #f1f5f9;
            margin-bottom: 2rem;
        }

        .thank-you-icon {
            font-size: 5rem;
            margin-bottom: 1rem;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-20px); }
            60% { transform: translateY(-10px); }
        }

        .btn-back {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background-color: #0ea5e9;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        .btn-back:hover {
            background-color: #0284c7;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="https://www.finsubito.org" class="logo">
                #Finsubito
            </a>
        </header>

        <main class="thank-you-container">
            <div class="thank-you-card">
                <div class="thank-you-icon">🎉</div>
                <h1>Grazie!</h1>
                <p>Abbiamo ricevuto la tua richiesta correttamente.<br>
                Un nostro consulente dedicato ti ricontatterà <strong>entro le prossime 24 ore</strong>.</p>

                <a href="index.html" class="btn-back">Torna alla Home</a>
            </div>
        </main>
    </div>
</body>
</html>
